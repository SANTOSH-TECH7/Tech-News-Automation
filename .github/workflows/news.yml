name: Tech News Digest

on:
  schedule:
    # UTC. Equals 7:30, 10:30, 13:30, 16:30, 19:30 and 22:30 IST.
    - cron: "0 2,5,8,11,14,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tech-news-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Send digest
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python3 news.py

      - name: Save sent-list
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/sent.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update sent list"
          git push
