name: Tech News Digest

on:
  schedule:
    # UTC. Equals 7:57, 10:57, 13:57, 16:57, 19:57 and 22:57 IST.
    # Minute 27, not 0: GitHub's shared scheduler is busiest at the top of the hour and
    # silently drops runs then. Between 15 and 21 Nov 2026 only about 2 of the 6 daily
    # runs actually fired while this was set to minute 0.
    - cron: "27 2,5,8,11,14,17 * * *"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Only send a test notification (no news fetch)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tech-news-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch news and update the feed
        if: ${{ !inputs.test_push }}
        run: python news.py

      - name: Publish feed and sent-list
        id: save
        if: ${{ !inputs.test_push }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/news.json state/sent.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update news feed"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Send push notification
        if: ${{ steps.save.outputs.changed == 'true' || inputs.test_push }}
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: |
          pip install --quiet pywebpush
          python news.py --notify ${{ inputs.test_push && '--test' || '' }}
